services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      CE_PROVIDER: ${CE_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CE_GEMINI_MODEL: ${CE_GEMINI_MODEL:-gemini-3.8-flash}
      CE_STORAGE: ${CE_STORAGE:-sqlite}
      CE_DB_PATH: /var/lib/commitments-extractor/app.db
    # Uploads contain patient data: keep them in memory only.
    tmpfs:
      - /tmp/commitments-extractor
    # The job database (extracted rows, no images) survives container restarts.
    volumes:
      - job-db:/var/lib/commitments-extractor

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  job-db:
