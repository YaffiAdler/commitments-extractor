# Generated from the Phase-0 review of samples/. See docs/form_mapping.md
id: maccabi_lab_request
display_name: Maccabi — request sheet from a sending lab (dot-matrix printer)
certainty: certain
seen_in: part 1 p. 9
detect:
  keywords:
  - קופ"ח מכבי-מעבדה שולחת
  - 'דרישה:'
  - ת.דרישה
  - 'נבדק:'
  logo_hint: No logo; dot-matrix print; round 'מכבי' stamp
fields:
  first_name:
    labels:
    - 'נבדק:'
    hint: The 'נבדק:' row. In the samples the name was replaced with blue handwriting (anonymization); real forms are expected to have it printed.
    multiple: false
    handwritten_possible: true
  last_name:
    labels:
    - 'נבדק:'
    hint: Same field.
    multiple: false
    handwritten_possible: true
  id_number:
    labels:
    - 'ת.ז.:'
    hint: On the same row; also on the bottom sticker 'ת.ז.'.
    multiple: false
    handwritten_possible: true
  central_numbers:
    labels:
    - מרכזי
    hint: 6-digit barcode sticker with the word 'מרכזי' printed next to it (usually highlighted in yellow); there may be several stickers. In the sample there are 3, one per sample type.
    multiple: true
    handwritten_possible: true
  received_date:
    labels:
    - התקבל
    - המעבדה המרכזית לנגיפים
    hint: Rectangular 'התקבל' stamp with a DD-MM-YYYY date, or a handwritten date below/next to the central number.
    multiple: false
    handwritten_possible: true
  sender:
    labels:
    - קופ"ח מכבי
    hint: Top row 'קופ"ח מכבי-מעבדה שולחת'.
    multiple: false
    handwritten_possible: false
  commitment_numbers:
    labels:
    - 'דרישה:'
    hint: '''דרישה: <branch code>/<8 digits>'' at the top, and also a sticker ''דרישה: <8 digits>''. The test-tube stickers (''<number>-(713)'') contain the same number + a suffix — they are not separate numbers.'
    multiple: true
    handwritten_possible: false
pages:
  typical: 1
